<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SecurityApp</title>
    <style type="text/css">
        .tblstyle {
            padding-top: 50px;
            padding-bottom: 50px;
            text-align: center;
            vertical-align: middle;
        }
    </style>
</head>
<body>
<h2>
    <span th:text="${label}"></span>
</h2>
<div>
    <h3>
        <b>Inventory</b>
    </h3>
    <table width="100%">
        <tr th:each="item: ${items}">
            <td th:text="${item.id}"/>
            <td th:text="${item.name}"/>
            <td th:text="${item.amount}"/>
        </tr>
    </table>
</div>
</body>
</html>
