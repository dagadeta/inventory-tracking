spring:
  application:
    name: inventory-tracking
  main:
    banner-mode: off
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory
    username: pguser
    password: pguser
  jpa:
    hibernate:
      #      ddl-auto: update
      ddl-auto: validate
    # show-sql: true
  # for tests and development: let flyway search for the flyway_schema_history table in the right schema
  flyway:
    schemas:
      - inventory

zonky:
  test:
    database:
      postgres:
        docker:
          image: postgres:18.4

logging:
  level:
    org:
      springframework:
        security: INFO
